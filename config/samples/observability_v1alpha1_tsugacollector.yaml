apiVersion: observability.tsuga.com/v1alpha1
kind: TsugaCollector
metadata:
  name: edge
  namespace: observability
spec:
  collector:
    mode: deployment
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
      service:
        pipelines:
          logs:
            receivers: [otlp]
