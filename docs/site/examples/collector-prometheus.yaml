apiVersion: observability.tsuga.com/v1alpha1
kind: TsugaCollectorConfig
metadata:
  name: cluster
spec:
  clusterName: dev
  export:
    tokenSecretRef:
      name: tsuga-credentials
      key: api-key
    endpointSecretRef:
      name: tsuga-credentials
      key: otlp-endpoint
  agent:
    traces: true
    metrics: true
    logs: true
  gateway:
    clusterMetrics: true
    kubernetesObjects: true
    kubernetesEvents: true
  prometheus:
    enabled: true
    scrapeInterval: 30s
    replicas: 1
    targetAllocator:
      enabled: false
      allocationStrategy: consistent-hashing
  # Placement and identity. Prefer per-collector tolerations: spec.tolerations
  # also reaches the single-replica gateway and the scraper.
  # agent:
  #   tolerations:
  #     - operator: Exists
  # serviceAccount:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/tsuga-collectors
