    Scope: {{alert_triggered_by}}.
    Items refused: {{alert_values[0]}}. Lookback: {{alert_timeframe}}. Conditions: {{alert_conditions}}.
    The Collector is at its memory limit. Raise the memory limit or reduce load. Collector logs: context.k8s.pod.name:tsuga-* in the affected cluster.
    Monitor: {{monitor_url}}
    Data: {{alert_data_url}}
  configuration:
    type: metric
    timeframe: 10
    queries:
    - aggregate:
        type: sum
        field: otelcol_processor_memory_limiter_refused_log_records
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_processor_memory_limiter_refused_metric_points
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_processor_memory_limiter_refused_spans
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    conditions:
    - formula: q1 + q2 + q3
      operator: greater_than
      threshold: 0
    noDataBehavior: resolve
    groupByFields:
    - fields:
      - context.k8s.cluster.name
      - context.k8s.pod.name
      limit: 100
    aggregationAlertLogic: each
