apiVersion: observability.tsuga.com/v1alpha1
kind: Monitor
metadata:
  name: tsuga-collector-dropped
  namespace: default
spec:
  name: OpenTelemetry Collector - Telemetry dropped (export queue full)
  owner: <YOUR_TEAM_ID>
  priority: 1
  permissions: all
  tags:
  - key: source
    value: tsuga-operator
  - key: component
    value: otel-collector
  message: |-
    OpenTelemetry Collector — Telemetry dropped (export queue full): {{alert_status}}.
    Scope: {{alert_triggered_by}}.
    Items dropped: {{alert_values[0]}}. Lookback: {{alert_timeframe}}. Conditions: {{alert_conditions}}.
    The exporter queue is full and new data is dropped. Check destination availability and errors, and queue sizing. Collector logs: context.k8s.pod.name:tsuga-* in the affected cluster.
    Monitor: {{monitor_url}}
    Data: {{alert_data_url}}
  configuration:
    type: metric
    timeframe: 5
    queries:
    - aggregate:
        type: sum
        field: otelcol_exporter_enqueue_failed_log_records
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill: &id001
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_enqueue_failed_metric_points
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_enqueue_failed_spans
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_enqueue_failed_profile_samples
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill: *id001
    conditions:
    - formula: q1 + q2 + q3 + q4
      operator: greater_than
      threshold: 0
    noDataBehavior: resolve
    groupByFields:
    - fields:
      - context.k8s.cluster.name
      - context.k8s.pod.name
      limit: 100
    aggregationAlertLogic: each
---
apiVersion: observability.tsuga.com/v1alpha1
kind: Monitor
metadata:
  name: tsuga-collector-export-failures
  namespace: default
spec:
  name: OpenTelemetry Collector - Export failures
  owner: <YOUR_TEAM_ID>
  priority: 2
  permissions: all
  tags:
  - key: source
    value: tsuga-operator
  - key: component
    value: otel-collector
  message: |-
    OpenTelemetry Collector — Export failures: {{alert_status}}.
    Scope: {{alert_triggered_by}}.
    Failed export ratio: {{alert_values[0]}}. Lookback: {{alert_timeframe}}. Conditions: {{alert_conditions}}.
    Usually rate limits (429), intermittent errors from the destination, or a failing extra exporter. A rejected ingestion key or blocked egress to Tsuga shows as Self-telemetry missing instead. Collector logs: context.k8s.pod.name:tsuga-* in the affected cluster.
    Monitor: {{monitor_url}}
    Data: {{alert_data_url}}
  configuration:
    type: metric
    timeframe: 10
    queries:
    - aggregate:
        type: sum
        field: otelcol_exporter_send_failed_log_records
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_send_failed_metric_points
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_send_failed_spans
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_send_failed_profile_samples
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_sent_log_records
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_sent_metric_points
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_sent_spans
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    - aggregate:
        type: sum
        field: otelcol_exporter_sent_profile_samples
      metricKind: delta-counter
      filter: context.k8s.pod.name:tsuga-*
      fill:
        mode:
          type: zero
    conditions:
    - formula: (q1 + q2 + q3 + q4) / (q1 + q2 + q3 + q4 + q5 + q6 + q7 + q8)
      operator: greater_than
      threshold: 0.05
    noDataBehavior: resolve
    groupByFields:
    - fields:
      - context.k8s.cluster.name
      - context.k8s.pod.name
      limit: 100
    aggregationAlertLogic: each
---
apiVersion: observability.tsuga.com/v1alpha1
