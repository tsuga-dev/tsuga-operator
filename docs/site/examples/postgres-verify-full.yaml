apiVersion: observability.tsuga.com/v1alpha1
kind: TsugaPostgresMonitoring
metadata:
  name: orders-db
  namespace: orders
spec:
  host: orders-pg-rw.orders.svc
  sslMode: verify-full
  tls:
    volume:
      secret:
        secretName: orders-pg-ca
    caFile: ca.crt
  provisioning:
    mode: managed
    adminSecretRef:
      name: orders-pg-admin
