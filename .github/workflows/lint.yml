name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Single source of truth: the Makefile pin. A second pin here is how the
      # workflow ended up installing a golangci-lint that rejected a config
      # the Makefile's version accepted.
      - name: Resolve golangci-lint version
        id: golangci
        run: echo "version=$(grep -oE '^GOLANGCI_LINT_VERSION \?= .*' Makefile | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

      - name: Run linter
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.golangci.outputs.version }}
