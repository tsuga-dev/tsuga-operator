name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Tags the newest CHANGELOG.md version. The app token is required: tags pushed
  # with GITHUB_TOKEN do not trigger publish-image.yaml or the release job below.
  tag:
    name: Tag latest changelog release
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Tag latest changelog release
        run: |
          version=$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {match($0, /[0-9]+\.[0-9]+\.[0-9]+/); print substr($0, RSTART, RLENGTH); exit}' CHANGELOG.md)
          test -n "$version"
          git show-ref --tags --verify --quiet "refs/tags/v$version" && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v$version" -m "Release v$version"
          git push origin "v$version"

  release:
    name: Create GitHub release with install manifests
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to create the GitHub release
      packages: read   # needed to check the image publish-image.yaml pushes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Strip the leading 'v' to get a plain semver (e.g. v0.1.0 → 0.1.0).
      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # build-installer:
      #   1. Runs 'make manifests' to regenerate CRD/RBAC from type markers
      #   2. Sets the manager image in config/manager/kustomization.yaml
      #   3. Runs 'kustomize build config/default > dist/install.yaml'
      - name: Generate install manifests
        run: |
          make build-installer \
            IMG=ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # install.yaml points at this image, which publish-image.yaml pushes from
      # the same tag in parallel. Do not publish the release until it exists.
      - name: Wait for the release image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
        run: |
          for _ in $(seq 60); do
            if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Waiting for $IMAGE..."
            sleep 30
          done
          echo "$IMAGE was not published within 30 minutes." >&2
          exit 1

      # Commits here are all sync commits, so notes come from CHANGELOG.md.
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > dist/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Release ${{ github.ref_name }}"
          body_path: dist/release-notes.md
          files: dist/install.yaml

  # Opens a PR on tsuga-dev/helm-charts that ships this release: chart version
  # and appVersion, CRDs, manager RBAC and the release's CHANGELOG section.
  helm-chart-pr:
    name: Open Helm chart PR
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: helm-charts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/helm-charts
          token: ${{ steps.app-token.outputs.token }}
          path: helm-charts

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The chart version is the operator version. Chart-only changes never bump
      # it: they ship with the next operator release. A hand-bumped chart can
      # already hold this version, and chart-releaser skips existing versions
      # without failing, so the CRDs and RBAC would silently never ship.
      - name: Update chart
        env:
          VERSION: ${{ github.ref_name }}
          CHART: helm-charts/charts/tsuga-operator
        run: |
          VERSION=${VERSION#v}

          if git -C helm-charts ls-remote --exit-code --tags origin "refs/tags/tsuga-operator-$VERSION" >/dev/null; then
            echo "::error::helm-charts already has tag tsuga-operator-$VERSION; chart versions must track operator versions." >&2
            exit 1
          fi

          sed -i -E \
            -e "s/^version: .*/version: $VERSION/" \
            -e "s/^appVersion: .*/appVersion: \"$VERSION\"/" \
            "$CHART/Chart.yaml"

          rm -f "$CHART"/conf/crds/*.yaml
          cp config/crd/bases/*.yaml "$CHART/conf/crds/"

          # Swap the manager ClusterRole rules for the controller-gen ones; the
          # header and the metrics roles after it are chart-owned.
          role="$CHART/templates/clusterrole.yaml"
          {
            sed '/^rules:/q' "$role"
            sed '1,/^rules:/d' config/rbac/role.yaml
            sed -n '/^{{- if .Values.manager.metrics.enabled }}/,$p' "$role"
          } > "$RUNNER_TEMP/clusterrole.yaml"
          mv "$RUNNER_TEMP/clusterrole.yaml" "$role"

          changelog="$CHART/CHANGELOG.md"
          if ! grep -qF "## [$VERSION]" "$changelog"; then
            awk -v ver="$VERSION" '
              /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found = 1 }
              found { print }
            ' CHANGELOG.md \
              | sed "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/#g" \
              > "$RUNNER_TEMP/section.md"
            test -s "$RUNNER_TEMP/section.md"
            awk '
              NR == FNR { section = section $0 "\n"; next }
              !done && /^## \[/ { printf "%s", section; done = 1 }
              { print }
              END { if (!done) printf "\n%s", section }
            ' "$RUNNER_TEMP/section.md" "$changelog" > "$RUNNER_TEMP/CHANGELOG.md"
            mv "$RUNNER_TEMP/CHANGELOG.md" "$changelog"
          fi

          cd helm-charts
          make generate-examples CHARTS=tsuga-operator
          go run github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2 --chart-search-root=charts/tsuga-operator

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          path: helm-charts
          token: ${{ steps.app-token.outputs.token }}
          branch: release/tsuga-operator-${{ github.ref_name }}
          delete-branch: true
          title: 'feat(tsuga-operator): Update chart to operator ${{ github.ref_name }}'
          commit-message: 'feat(tsuga-operator): Update chart to operator ${{ github.ref_name }}'
          body: 'Ships [tsuga-operator ${{ github.ref_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}): chart version, CRDs, manager RBAC, rendered examples, README and release notes.'
