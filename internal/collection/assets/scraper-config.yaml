extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
receivers:
  prometheus:
    config:
      scrape_configs:
        # The de-facto prometheus.io/* pod annotations. When the Target
        # Allocator is enabled the OTel Operator reads this job off the
        # collector and hands each replica a slice of the discovered targets;
        # the job stays here either way.
        - job_name: tsuga-pod-annotations
          scrape_interval: __SCRAPE_INTERVAL__
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: "true"
            # Pods still starting have no IP yet, so without this the target
            # list churns with unscrapeable ":port" entries.
            - source_labels: [__meta_kubernetes_pod_phase]
              action: keep
              regex: Running
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
              action: replace
              target_label: __scheme__
              regex: (https?)
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
processors:
  batch:
    send_batch_size: 5000
    send_batch_max_size: 5000
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  # Runs before enrichment in the pipeline: delta state is keyed on the full
  # resource, so a series that starts unenriched and later gains pod metadata
  # would look like a new series and lose a datapoint to initial_value: auto.
  cumulative_to_delta: {}
  k8s_attributes:
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.pod.start_time
        - service.name
        - service.version
        - k8s.container.name
        - container.id
        - container.image.name
        - container.image.tag
      labels:
        - tag_name: env
          key: resource.opentelemetry.io/env
          from: pod
        - tag_name: team
          key: resource.opentelemetry.io/team
          from: pod
      annotations:
        - tag_name: service.name
          key: resource.opentelemetry.io/service.name
          from: pod
        - tag_name: service.version
          key: resource.opentelemetry.io/service.version
          from: pod
        - tag_name: env
          key: resource.opentelemetry.io/env
          from: pod
        - tag_name: team
          key: resource.opentelemetry.io/team
          from: pod
    passthrough: false
    pod_association:
      # k8s.pod.uid is what the prometheus receiver derives from the
      # kubernetes_sd discovery labels, and it is the only association that
      # resolves here: scraping is outbound, so `connection` never matches,
      # and nothing upstream sets k8s.pod.ip.
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
  resource:
    attributes:
      - key: k8s.cluster.name
        value: "__CLUSTER_NAME__"
        action: upsert
exporters:
  otlp_http/tsuga:
    endpoint: "__TSUGA_ENDPOINT__"
    headers:
      Authorization: Bearer ${env:TSUGA_API_KEY}
    encoding: json
    compression: gzip
service:
  extensions:
    - health_check
  pipelines:
    metrics:
      receivers:
        - prometheus
      processors:
        - memory_limiter
        - cumulative_to_delta
        - k8s_attributes
        - resource
        - batch
      exporters:
        - otlp_http/tsuga
  telemetry:
    resource:
      k8s.cluster.name: "__CLUSTER_NAME__"
      service.instance.id: ${POD_UID}
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                headers:
                  - name: Authorization
                    value: Bearer ${env:TSUGA_API_KEY}
                endpoint: "__TSUGA_ENDPOINT__/v1/metrics"
