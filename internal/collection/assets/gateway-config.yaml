extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
receivers:
  k8s_cluster:
    collection_interval: 10s
    allocatable_types_to_report: [cpu, memory, ephemeral-storage, pods]
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
    metrics:
      k8s.pod.status_reason:
        enabled: true
      # One point per known reason (9) per container, 1 for the current one.
      k8s.container.status.reason:
        enabled: true
  k8s_objects:
    auth_type: serviceAccount
    include_initial_state: true
    objects:
      - group: ""
        name: pods
        mode: watch
  # Core/v1, not events.k8s.io/v1: Tsuga's Kubernetes Events view reads
  # message, involvedObject and count, which events.k8s.io/v1 renames.
  #
  # A separate receiver instance only so events can set
  # include_initial_state: false. The field is receiver-wide and the pods
  # watch above needs its snapshot; sharing one would re-send the API
  # server's retained event window (an hour by default) on every restart.
  #
  # field_selector filters at the API server, so Normal events are never
  # transferred. The API server rejects an unsupported selector in a
  # background goroutine: a typo gives one log line and silence.
  #
  # exclude_watch_type drops DELETED: event expiry arrives on the watch
  # carrying the original object, which would report every warning twice.
  k8s_objects/events:
    auth_type: serviceAccount
    include_initial_state: false
    objects:
      - group: ""
        name: events
        mode: watch
        field_selector: type=Warning
        exclude_watch_type:
          - DELETED
processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    # Trigger a send when the batch reaches 5000 items.
    send_batch_size: 5000
    # Enforce a hard limit of 5000 items per batch. This prevents the
    # timeout from creating a massive batch that would be rejected.
    send_batch_max_size: 5000
  # k8s_objects sets no severity and Tsuga normalizes a missing level to
  # INFO. No condition: this pipeline only carries type=Warning records.
  transform/k8s_event_severity:
    error_mode: ignore
    log_statements:
      - set(log.severity_text, "WARN")
      - set(log.severity_number, SEVERITY_NUMBER_WARN)
  k8s_attributes:
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.pod.start_time
        - service.name
        - service.version
        - k8s.container.name
        - container.id
        - container.image.name
        - container.image.tags
      labels:
        - tag_name: team
          key: resource.opentelemetry.io/team
          from: pod
      otel_annotations: true
    passthrough: false
    pod_association:
      - sources:
        - from: resource_attribute
          name: k8s.pod.ip
      - sources:
        - from: resource_attribute
          name: k8s.pod.uid
      - sources:
        - from: connection
  resource:
    attributes:
      - key: k8s.cluster.name
        value: "__CLUSTER_NAME__"
        action: upsert
exporters:
  otlp_http/tsuga:
    endpoint: "__TSUGA_ENDPOINT__"
    headers:
      Authorization: Bearer ${env:TSUGA_API_KEY}
    encoding: json
    compression: gzip
service:
  extensions:
    - health_check
  pipelines:
    logs:
      receivers:
        - k8s_cluster
        - k8s_objects
      processors:
        - memory_limiter
        - k8s_attributes
        - resource
        - batch
      exporters:
        - otlp_http/tsuga
    # k8s_attributes is absent: an event record carries only
    # k8s.namespace.name, which no pod_association source matches.
    logs/events:
      receivers:
        - k8s_objects/events
      processors:
        - memory_limiter
        - transform/k8s_event_severity
        - resource
        - batch
      exporters:
        - otlp_http/tsuga
    metrics:
      receivers:
        - k8s_cluster
      processors:
        - memory_limiter
        - k8s_attributes
        - resource
        - batch
      exporters:
        - otlp_http/tsuga
  telemetry:
    resource:
      k8s.cluster.name: "__CLUSTER_NAME__"
      service.instance.id: ${POD_UID}
      k8s.pod.name: ${POD_NAME}
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                # Tsuga monitors sum delta counters; the SDK default is cumulative.
                temporality_preference: delta
                headers:
                  - name: Authorization
                    value: Bearer ${env:TSUGA_API_KEY}
                endpoint: "__TSUGA_ENDPOINT__/v1/metrics"
