extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
receivers:
  k8s_cluster:
    collection_interval: 10s
    allocatable_types_to_report: [cpu, memory, ephemeral-storage]
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
    metrics:
      k8s.pod.status_reason:
        enabled: true
  k8s_objects:
    auth_type: serviceAccount
    include_initial_state: true
    objects:
      - group: ""
        name: pods
        mode: watch
processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    # Trigger a send when the batch reaches 5000 items.
    send_batch_size: 5000
    # Enforce a hard limit of 5000 items per batch. This prevents the
    # timeout from creating a massive batch that would be rejected.
    send_batch_max_size: 5000
  k8s_attributes:
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.pod.start_time
        - service.name
        - service.version
        - k8s.container.name
        - container.id
        - container.image.name
        - container.image.tag
      labels:
        - tag_name: env
          key: resource.opentelemetry.io/env
          from: pod
        - tag_name: team
          key: resource.opentelemetry.io/team
          from: pod
      annotations:
        - tag_name: service.name
          key: resource.opentelemetry.io/service.name
          from: pod
        - tag_name: service.version
          key: resource.opentelemetry.io/service.version
          from: pod
        - tag_name: env
          key: resource.opentelemetry.io/env
          from: pod
        - tag_name: team
          key: resource.opentelemetry.io/team
          from: pod
    passthrough: false
    pod_association:
      - sources:
        - from: resource_attribute
          name: k8s.pod.ip
      - sources:
        - from: resource_attribute
          name: k8s.pod.uid
      - sources:
        - from: connection
  resource:
    attributes:
      - key: k8s.cluster.name
        value: "__CLUSTER_NAME__"
        action: upsert
exporters:
  otlp_http/tsuga:
    endpoint: "__TSUGA_ENDPOINT__"
    headers:
      Authorization: Bearer ${env:TSUGA_API_KEY}
    encoding: json
    compression: gzip
service:
  extensions:
    - health_check
  pipelines:
    logs:
      receivers:
        - k8s_cluster
        - k8s_objects
      processors:
        - memory_limiter
        - k8s_attributes
        - resource
        - batch
      exporters:
        - otlp_http/tsuga
    metrics:
      receivers:
        - k8s_cluster
      processors:
        - memory_limiter
        - k8s_attributes
        - resource
        - batch
      exporters:
        - otlp_http/tsuga
  telemetry:
    resource:
      k8s.cluster.name: "__CLUSTER_NAME__"
      service.instance.id: ${POD_UID}
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                headers:
                  - name: Authorization
                    value: Bearer ${env:TSUGA_API_KEY}
                endpoint: "__TSUGA_ENDPOINT__/v1/metrics"
